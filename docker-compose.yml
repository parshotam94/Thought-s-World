services:

  app:

    build: .

    container_name: thoughtbox-app

    expose:
      - "5000"

    volumes:
      - .:/app

    restart: always


  nginx:

    image: nginx:latest

    container_name: thoughtbox-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app